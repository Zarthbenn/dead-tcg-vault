<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.min.js"></script>
<script>
// ── State ─────────────────────────────────────────────────
const state = {
  games: [],
  currentGame: null,
  db: null,
  currentSet: null,
  loadedDbs: {}
};
let gridColWidth = 150;

// ── sql.js init ───────────────────────────────────────────
const SQL_READY = initSqlJs({
  locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
});

// ── Boot ─────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('games.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.games = await res.json();

    // Deep links:  #/gameId  ·  #/gameId/db?filters  ·  #/gameId/museum  ·  #/gameId/set/N
    // (legacy #game=id&… links map to the db route)
    const route = parseRoute();
    if (route) {
      const game = state.games.find(g => g.id === route.game);
      if (game) {
        try {
          document.getElementById('app').innerHTML =
            `<div class="page"><div class="state-msg"><span class="loading-ring"></span>Loading ${game.name}…</div></div>`;
          const db = game.db ? await loadGameDb(game) : null;
          state.currentGame = game;
          state.db = db;

          if (route.kind === 'db' && db) {
            renderGameDb(game, db, null, route.filters);
            return;
          }
          if (route.kind === 'museum') {
            renderMuseum(game);
            if (document.getElementById('museum-page')) return; // may decline (no images)
          }
          if (route.kind === 'set' && db) {
            openSet(route.setId);
            if (state.currentSet) return; // openSet no-ops on unknown set ids
          }
          renderGame(game, db); // 'game' kind, and fallback for the above
          return;
        } catch(e) { /* fall through to home */ }
      }
    }
    renderHome();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="page"><div class="state-msg">
        <h3>Could not load games.json</h3>
        <p>Make sure you're running this through a local server,<br>not opening index.html directly as a file.</p>
      </div></div>`;
  }
}

// ── Query helper ──────────────────────────────────────────
function q(db, sql, params = []) {
  const res = db.exec(sql, params);
  if (!res.length) return [];
  const { columns, values } = res[0];
  return values.map(row => Object.fromEntries(columns.map((c, i) => [c, row[i]])));
}

// ── Load a game DB (with cache) ───────────────────────────
async function loadGameDb(game) {
  if (state.loadedDbs[game.db]) return state.loadedDbs[game.db];
  const SQL = await SQL_READY;
  const res = await fetch(game.db);
  if (!res.ok) throw new Error(`Could not fetch ${game.db}`);
  const buf = await res.arrayBuffer();
  const db = new SQL.Database(new Uint8Array(buf));
  state.loadedDbs[game.db] = db;
  return db;
}

// ── Breadcrumb ────────────────────────────────────────────
function setBreadcrumb(crumbs) {
  // crumbs: [{label, onClick}] — last one is current (no click)
  const el = document.getElementById('breadcrumb');
  el.innerHTML = crumbs.map((c, i) => {
    const last = i === crumbs.length - 1;
    const sep = i > 0 ? `<span class="sep">›</span>` : '';
    if (last) return `${sep}<span class="crumb current">${c.label}</span>`;
    return `${sep}<span class="crumb" onclick="(${c.onClick})()">${c.label}</span>`;
  }).join('');
}

// ── HOME ──────────────────────────────────────────────────
function renderHome() {
  setRoute('');
  tcgTrack('Home — Archive');
  state.currentGame = null;
  state.currentSet = null;
  state.db = null;
  setBreadcrumb([]);
  window.scrollTo({ top: 0, behavior: 'instant' });
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="game-grid" id="game-grid"></div>
    </div>`;
  const grid = document.getElementById('game-grid');
  if (!state.games.length) {
    grid.innerHTML = `<div class="state-msg"><h3>No games in archive yet</h3><p>Add entries to games.json to get started.</p></div>`;
    return;
  }
  const sortedGames = [...state.games].sort((a, b) => a.name.localeCompare(b.name));
  sortedGames.forEach(game => {
    const tile = document.createElement('div');
    tile.className = 'game-tile';
    tile.style.setProperty('--game-color', game.cover_color || '#c8963c');

    const heroInner = game.hero_image
      ? `<img src="${game.hero_image}" alt="${game.name}" onerror="tileImgFallback(this, '${game.name.replace(/'/g, "\\'")}')">`
      : `<div class="game-tile-hero-fallback"><span>${game.name}</span></div>`;
    const tileLogoHtml = game.logo_image
      ? `<div class="game-tile-logo"><img src="${game.logo_image}" alt="${game.name} logo"></div>`
      : '';

    const hasDb = !!game.db;

    tile.innerHTML = `
      <div class="game-tile-hero">${heroInner}${tileLogoHtml}</div>
      <div class="game-tile-body">
        <div class="game-tile-name">
          ${game.name}<span class="game-tile-name-arrow">→</span>
        </div>
        <hr class="game-tile-divider">
        <div class="game-tile-row1">
          ${game.years_active ? `<span class="game-tile-meta-text" style="flex-shrink:0">${game.years_active}</span>` : ''}
          ${game.years_active && game.publisher ? `<span class="game-tile-meta-sep">·</span>` : ''}
          ${game.publisher ? `<span class="game-tile-meta-text" style="overflow:hidden;text-overflow:ellipsis;min-width:0">${game.publisher}</span>` : ''}
        </div>
        <div class="game-tile-row2">
          <div class="game-tile-count-chips" id="count-${game.id}"></div>
          ${hasDb ? `<span class="game-tile-db-tag">Card database</span>` : ''}
        </div>
      </div>`;

    tile.addEventListener('click', () => openGame(game, tile));
    grid.appendChild(tile);

    // Per-tile set/card counts. Priority:
    //   1. Manual sets_count / cards_count from games.json (no download — best for many games)
    //   2. Query the DB (downloads the full .db just for counts — fine for a few games)
    const renderCount = (el, sets, cards) => {
      if (!el) return;
      const parts = [];
      if (sets)  parts.push(`<span class="game-tile-count-text">${sets} sets</span>`);
      if (cards) parts.push(`<span class="game-tile-count-text">${cards} cards</span>`);
      el.innerHTML = parts.join('<span class="game-tile-count-sep">·</span>');
    };
    const countEl = () => document.getElementById(`count-${game.id}`);
    if (game.sets_count || game.cards_count) {
      renderCount(countEl(), game.sets_count, game.cards_count);
    } else if (game.db) {
      loadGameDb(game).then(db => {
        const row = q(db, `SELECT COUNT(DISTINCT s.id) as set_count, COUNT(c.id) as card_count
          FROM sets s LEFT JOIN cards c ON c.set_id = s.id`)[0];
        if (row) renderCount(countEl(), row.set_count, row.card_count);
      }).catch(() => {});
    }
  });
}

// ── GAME VIEW ─────────────────────────────────────────────
async function openGame(game, tileEl) {
  if (tileEl) {
    tileEl.style.opacity = '0.6';
    tileEl.innerHTML += `<span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"><span class="loading-ring"></span></span>`;
  }
  // If show_sets is false and no db is specified, render without DB using manual counts
  if (game.show_sets === false && !game.db) {
    state.currentGame = game;
    state.db = null;
    state.currentSet = null;
    window.scrollTo({ top: 0, behavior: 'instant' });
    renderGame(game, null);
    return;
  }
  try {
    const db = await loadGameDb(game);
    state.currentGame = game;
    state.db = db;
    state.currentSet = null;
    window.scrollTo({ top: 0, behavior: 'instant' });
    renderGame(game, db);
  } catch(e) {
    alert(`Failed to load ${game.name}: ${e.message}`);
    if (tileEl) { tileEl.style.opacity = ''; renderHome(); }
  }
}

function renderLinkList(links) {
  const valid = (links || []).filter(l => l.url && l.url.trim() !== '');
  if (!valid.length) return `<span class="info-empty">None listed</span>`;
  return `<ul class="info-link-list">${valid.map(l =>
    `<li><a href="${l.url}" target="_blank" rel="noopener">${l.label}</a></li>`
  ).join('')}</ul>`;
}

// ── Daily pick cache ──────────────────────────────────────
// Random image picks (overview panel, preview row, set tile backgrounds) are
// cached per game for 24h. Repeat visits then request the SAME URLs, letting the
// browser's HTTP cache absorb them instead of hitting Google Drive again.
function dailyPicks(gameId, key, computeFn) {
  const storeKey = `tcgvault:picks:${gameId}`;
  let entry = null;
  try { entry = JSON.parse(localStorage.getItem(storeKey)); } catch(e) {}
  if (!entry || Date.now() - entry.t > 24 * 3600 * 1000) entry = { t: Date.now() };
  if (entry[key] === undefined) {
    entry[key] = computeFn();
    try { localStorage.setItem(storeKey, JSON.stringify(entry)); } catch(e) {}
  }
  return entry[key];
}

function renderGame(game, db) {
  setRoute(encodeURIComponent(game.id));
  tcgTrack(`Game — ${game.name}`);
  const sets = db ? q(db, `
    SELECT s.*, (SELECT COUNT(*) FROM cards WHERE set_id = s.id) as card_count
    FROM sets s ORDER BY s.id ASC`) : [];

  setBreadcrumb([
    { label: 'Archive', onClick: `renderHome` },
    { label: game.name }
  ]);

  const totalCards = db
    ? sets.reduce((a, s) => a + (s.card_count || 0), 0)
    : (game.cards_count ?? '—');
  const setsCount = db ? sets.length : (game.sets_count ?? '—');

  const gc = game.cover_color || '#8a6628';

  // ── Page hero banner ───────────────────────────
  const heroHtml = `
    <div class="game-page-hero" style="--game-color: ${gc}">
      ${game.hero_image
        ? `<img src="${game.hero_image}" alt="${game.name}" onerror="pageHeroFallback(this)">`
        : `<div class="game-page-hero-fallback"></div>`}
      ${game.logo_image
        ? `<div class="game-page-logo"><img src="${game.logo_image}" alt="${game.name} logo"></div>`
        : ''}
    </div>`;

  // ── Quick facts + designers ────────────────────
  const facts = [];
  if (game.publisher)    facts.push({ label: 'Publisher',    val: game.publisher });
  if (game.years_active) facts.push({ label: 'Years Active', val: game.years_active });
  facts.push({ label: 'Sets',  val: setsCount });
  facts.push({ label: 'Cards', val: totalCards });
  const designerChits = game.designers?.length
    ? `<div class="game-fact-designers">
        <div class="game-fact-label">Designed by</div>
        <div class="game-fact-val">${game.designers.join(', ')}</div>
      </div>` : '';
  const factsHtml = `
    <div class="game-facts">
      ${facts.map(f => `
        <div class="game-fact">
          <div class="game-fact-label">${f.label}</div>
          <div class="game-fact-val">${f.val}</div>
        </div>`).join('')}
      ${designerChits}
    </div>
    <hr class="game-facts-sep">`;

  // ── Overview + cycling card panel ──────────────
  let overviewHtml = '';
  if (game.overview) {
    const cardImgs = db ? dailyPicks(game.id, 'overview', () => q(db,
      `SELECT image_url FROM cards
       WHERE image_url IS NOT NULL AND image_url != ''
       ORDER BY RANDOM() LIMIT 3`))
      : (game.preview_cards || []).filter(p => p.url?.trim()).slice(0, 3).map(p => ({ image_url: p.url }));
    const panelHtml = cardImgs.length ? `
      <div class="overview-card-panel" id="overview-panel">
        ${cardImgs.map((r, i) => `
        <div class="overview-card-slide${i === 0 ? ' active' : ''}"
             style="background-image: url('${r.image_url}')"></div>`).join('')}
      </div>` : '';
    overviewHtml = `
      <div class="game-overview-block">
        <div class="game-overview-text">
          <p class="game-overview">${game.overview}</p>
        </div>
        ${panelHtml}
      </div>`;
  }

  // ── How to play / Rulebooks / Where to play ──
  const infoRowHtml = `
    <div class="game-info-panel">
      <div class="game-info-panel-title">How to Play Videos</div>
      ${renderLinkList(game.how_to_play_videos || (game.how_to_play_video ? [{ label: 'Watch on YouTube', url: game.how_to_play_video }] : []))}
    </div>
    <div class="game-info-panel">
      <div class="game-info-panel-title">Rulebooks &amp; Guides</div>
      ${renderLinkList(game.rulebook_links)}
    </div>
    <div class="game-info-panel">
      <div class="game-info-panel-title">Where to Play</div>
      ${renderLinkList(game.where_to_play_links)}
    </div>`;

  // ── Scan doc + Community side by side ──────────
  const nameTags = (arr) => {
    if (!arr) return '<span class="info-empty">None listed</span>';
    const list = Array.isArray(arr) ? arr : [arr];
    return `<div class="scan-names">${list.map(n => `<span class="scan-name-tag">${n}</span>`).join('')}</div>`;
  };
  const sp = game.scan_project || {};
  const years = [sp.start_year, sp.end_year].filter(Boolean).join('–');

  const scanInnerHtml = (game.card_back_image || game.scan_project) ? `
    <div class="scan-section span-2">
      <div class="scan-section-inner">
        ${game.card_back_image ? `
        <div class="scan-card-back">
          <img src="${game.card_back_image}" alt="Card back"
            onerror="this.style.display='none';this.nextElementSibling.textContent='Image unavailable'">
          <span class="scan-card-back-label">Card Back</span>
        </div>` : ''}
        <div class="scan-info">
          <div class="scan-info-title">Scan Documentation</div>
          <div class="scan-fields">
            ${sp.scanned_by   ? `<div class="scan-field"><label>Scanned by</label>${nameTags(sp.scanned_by)}</div>` : ''}
            ${sp.processed_by ? `<div class="scan-field"><label>Processed by</label>${nameTags(sp.processed_by)}</div>` : ''}
            ${years           ? `<div class="scan-field"><label>Project Years</label><p class="scan-year-val">${years}</p></div>` : ''}
            ${sp.notes        ? `<p class="scan-notes">${sp.notes}</p>` : ''}
          </div>
        </div>
        ${sp.downloads?.length ? `
        <div class="scan-downloads-col">
          <span class="scan-downloads-label">Download Full Scans</span>
          <div class="scan-download-links">
            ${sp.downloads.map(d => `
            <a href="${d.url}" class="scan-download-link" target="_blank" rel="noopener">
              <span class="scan-download-icon">↓</span>
              ${d.label}
            </a>`).join('')}
          </div>
          ${sp.additional_notes ? `<p class="scan-additional-notes">${sp.additional_notes}</p>` : ''}
        </div>` : ''}
      </div>
    </div>` : '';

  const communityHtml = `
    <div class="scan-community-panel">
      <div class="game-info-panel-title">Community</div>
      ${renderLinkList(game.community_links)}
    </div>`;

  const scanCommunityHtml = (scanInnerHtml || game.community_links?.length) ? `
    ${scanInnerHtml || '<div class="span-2"></div>'}
    ${communityHtml}` : '';

  // ── Set tiles ──────────────────────────────────
  const showSets = game.show_sets !== false;
  const setBgPicks = showSets && db ? dailyPicks(game.id, 'setBg', () => {
    const m = {};
    sets.forEach(s => {
      const r = q(db, `SELECT image_url FROM cards WHERE set_id = ? AND image_url IS NOT NULL AND image_url != ''
        ORDER BY RANDOM() LIMIT 1`, [s.id]);
      if (r.length) m[s.id] = r[0].image_url;
    });
    return m;
  }) : {};
  const setsHtml = showSets ? sets.map(s => {
    const bgImg = setBgPicks[s.id]
      ? `<img class="set-tile-bg-img" src="${setBgPicks[s.id]}" alt="" loading="lazy">`
      : '';
    return `
    <div class="set-tile" onclick="renderGameDb(state.currentGame, state.db, ${s.id})">
      <div class="set-tile-bg">${bgImg}</div>
      <div class="set-tile-body">
        <div class="set-tile-top">
          <span class="set-tile-name">${s.name}</span>
          ${s.code ? `<span class="set-tile-code">${s.code}</span>` : ''}
        </div>
        <div class="set-tile-meta">
          ${s.release_date ? `<span class="set-tile-date">${s.release_date}</span>` : ''}
          <span class="set-tile-count">${s.card_count} cards</span>
        </div>
        ${s.notes ? `<div class="set-tile-notes">${s.notes}</div>` : ''}
      </div>
      <span class="set-tile-arrow">→</span>
    </div>`;
  }).join('') : '';

  // ── Card Preview ────────────────────────────────
  // When show_sets is false, manual preview cards can be set in games.json:
  // "preview_cards": [
  //   { "url": "https://...", "name": "Card Name" },
  //   ...
  // ]
  const manualPreview = !showSets && game.preview_cards?.length;
  const previewCards = manualPreview
    ? game.preview_cards.slice(0, 6).map(p => ({ id: null, name: p.name || '', image_url: p.url, manual: true }))
    : (db ? dailyPicks(game.id, 'preview', () =>
        q(db, `SELECT id, name, card_type, rarity, image_url, collector_number FROM cards WHERE image_url IS NOT NULL AND image_url != '' ORDER BY RANDOM() LIMIT 6`)) : []);

  const makePreviewItem = (card) => {
    const idAttr = card.id ? `data-preview-id="${card.id}"` : '';
    const urlAttr = card.image_url ? `data-preview-url="${card.image_url}"` : '';
    const nameAttr = `data-preview-name="${(card.name || '').replace(/"/g,'&quot;')}"`;
    // Broken/missing images leave an empty, non-clickable frame
    const inner = card.image_url
      ? `<img src="${card.image_url}" alt="${card.name || ''}" loading="lazy" onerror="previewImgRetry(this)">`
      : '';
    return `<div class="card-preview-item" ${idAttr} ${urlAttr} ${nameAttr}>${inner}</div>`;
  };

  const cardBackCenter = game.card_back_image
    ? `<div class="card-preview-item card-back-center" data-preview-url="${game.card_back_image}" data-preview-name="Card Back"><img src="${game.card_back_image}" alt="Card back" loading="lazy" onerror="previewImgRetry(this)"></div>`
    : '';

  const previewLeft  = previewCards.slice(0, 3);
  const previewRight = previewCards.slice(3, 6);

  // Museum: every card with an image, viewed one at a time in random order.
  // Only offered for games with card sets (show_sets not false).
  const museumCount = (showSets && db)
    ? (q(db, `SELECT COUNT(*) AS n FROM cards WHERE image_url IS NOT NULL AND image_url != ''`)[0]?.n || 0)
    : 0;

  const museumBtnHtml = museumCount > 0 ? `
    <div class="museum-launch">
      <button class="launch-btn" onclick="renderMuseum(state.currentGame)">
        <div class="launch-btn-left">
          <span class="launch-btn-title">View Museum for <span class="launch-game-name">${game.name}</span></span>
          <span class="launch-btn-stats">${museumCount.toLocaleString()} cards</span>
        </div>
        <span class="launch-arrow">→</span>
      </button>
    </div>` : '';

  const cardPreviewHtml = (previewCards.length || game.card_back_image) ? `
    <div class="section-title">Card Preview</div>
    <div class="card-preview-grid">
      ${previewLeft.map(makePreviewItem).join('')}
      ${cardBackCenter}
      ${previewRight.map(makePreviewItem).join('')}
    </div>
    ${museumBtnHtml}` : museumBtnHtml;

  // ── How to Play Video embed ─────────────────────
  // Show embeds from how_to_play_videos unless show_video_section: false
  // To disable: add "show_video_section": false to the game in games.json
  function getYtId(url) {
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([-\w]{11})/);
    return m ? m[1] : null;
  }
  let videoSectionHtml = '';
  if (game.show_video_section !== false) {
    const firstVideo = (game.how_to_play_videos || []).find(v => v.url && getYtId(v.url));
    if (firstVideo) {
      videoSectionHtml = `
        <div class="section-title">How To Play Video</div>
        <div class="video-section-grid">
          <div class="video-embed-wrap">
            <iframe
              src="https://www.youtube-nocookie.com/embed/${getYtId(firstVideo.url)}"
              title="${firstVideo.label || 'How To Play Video'}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
              loading="lazy">
            </iframe>
          </div>
        </div>`;
    }
  }

  document.getElementById('app').innerHTML = `
    ${heroHtml}
    <div class="page game-page" style="--game-color: ${gc}">
      <div class="game-hero">
        <h1 class="game-title">${game.name}</h1>
      </div>
      <div class="game-info">
        ${factsHtml}
        ${overviewHtml}
        <div class="section-title">Resources</div>
        <div class="game-info-panels">
          ${infoRowHtml}
          ${scanCommunityHtml}
        </div>
        ${cardPreviewHtml}
        ${videoSectionHtml}
      </div>
      ${showSets ? `
      <div class="section-title">Card Database</div>
      <div class="game-db-launch">
        <button class="launch-btn" onclick="renderGameDb(state.currentGame, state.db)">
          <div class="launch-btn-left">
            <span class="launch-btn-title">View Card Database for <span class="launch-game-name">${game.name}</span></span>
            <span class="launch-btn-stats">${setsCount} sets · ${totalCards} cards</span>
          </div>
          <span class="launch-arrow">→</span>
        </button>
      </div>
      <div class="set-list">${setsHtml || '<p style="color:var(--text-dim)">No sets found.</p>'}</div>` : ''}
    </div>`;

  // Start cycling the overview card panel (clear any cycler from a previous game page)
  clearInterval(window._overviewCycler);
  const panelSlides = document.querySelectorAll('.overview-card-slide');
  if (panelSlides.length > 1) {
    let cur = 0;
    window._overviewCycler = setInterval(() => {
      if (!document.body.contains(panelSlides[0])) { clearInterval(window._overviewCycler); return; }
      panelSlides[cur].classList.remove('active');
      cur = (cur + 1) % panelSlides.length;
      panelSlides[cur].classList.add('active');
    }, 3500);
  }

  // Card preview — open lightbox on click (checked at click time: broken images clear the URL)
  document.querySelectorAll('.card-preview-item[data-preview-url]').forEach(el => {
    el.addEventListener('click', () => {
      if (!el.dataset.previewUrl) return;
      const lb  = document.getElementById('card-lightbox');
      const img = document.getElementById('card-lightbox-img');
      img.src = el.dataset.previewUrl;
      img.alt = el.dataset.previewName || '';
      lb.classList.add('open');
    });
  });
}

// ── CARD MUSEUM ───────────────────────────────────────────
// Full-screen gallery: every card with an image, shuffled, one at a time.
let museumState = null; // { game, cards, idx, loadToken, keyHandler }

// Google Drive thumbnails are stored at sz=w350 for grids; the museum
// swaps in a full-size render.
function museumHiRes(url) {
  if (!url) return url;
  if (/drive\.google\.com\/thumbnail/.test(url)) {
    return /sz=w\d+/.test(url)
      ? url.replace(/sz=w\d+/, 'sz=w2000')
      : url + (url.includes('?') ? '&' : '?') + 'sz=w2000';
  }
  return url;
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Map a card's rarity text to a frame tier. Unknown/missing → common (baseline frame).
function museumFrameTier(rarity) {
  if (!rarity) return 'common';
  const r = String(rarity).toLowerCase();
  if (/legend|epic|mythic|ultra|loot|promo|special/.test(r)) return 'legendary';
  if (/uncommon/.test(r)) return 'uncommon';
  if (/rare/.test(r)) return 'rare';
  return 'common';
}

function renderMuseum(game) {
  const db = (game.db && state.loadedDbs[game.db]) || state.db;
  let cards;
  if (db) {
    cards = q(db, `
      SELECT c.id, c.name, c.artist, c.rarity, c.image_url, s.name AS set_name
      FROM cards c LEFT JOIN sets s ON s.id = c.set_id
      WHERE c.image_url IS NOT NULL AND c.image_url != ''
      ORDER BY RANDOM()`);
  } else {
    cards = shuffleArr((game.preview_cards || [])
      .filter(p => p.url && p.url.trim() !== '')
      .map(p => ({ id: null, name: p.name || '', artist: p.artist || '', rarity: p.rarity || '', image_url: p.url, set_name: '' })));
  }
  if (!cards.length) return;
  setRoute(`${encodeURIComponent(game.id)}/museum`);
  tcgTrack(`Museum — ${game.name}`);

  // Clean up a previous session's key handler (e.g. museum exited via breadcrumb)
  if (museumState?.keyHandler) document.removeEventListener('keydown', museumState.keyHandler, true);
  museumState = { game, cards, idx: 0, loadToken: 0 };
  state.currentSet = null;

  setBreadcrumb([
    { label: 'Archive', onClick: `renderHome` },
    { label: game.name, onClick: `() => renderGame(state.currentGame, state.db)` },
    { label: 'Museum' }
  ]);
  window.scrollTo({ top: 0, behavior: 'instant' });

  document.getElementById('app').innerHTML = `
    <div class="museum-page" id="museum-page">
      <div class="museum-top">
        <button class="museum-back" onclick="exitMuseum()">← ${game.name}</button>
        <div class="museum-top-right">
          <button class="museum-shuffle" onclick="museumReshuffle()" title="Reshuffle the gallery">⤮ Shuffle</button>
          <span class="museum-pos" id="museum-pos"></span>
        </div>
      </div>

      <div class="museum-stage">
        <span class="museum-wait" id="museum-wait"><span class="loading-ring"></span></span>
        <button class="museum-nav" onclick="museumStep(-1)" aria-label="Previous card">‹</button>

        <div>
          <div class="museum-exhibit">
            <div class="museum-frame-wrap" id="museum-frame-wrap">
              <div class="museum-frame tier-common" id="museum-frame">
                <span class="orn bead-ring"></span>
                <span class="orn gilt-ring"></span>
                <span class="orn ros ros-tl"></span><span class="orn ros ros-tr"></span>
                <span class="orn ros ros-bl"></span><span class="orn ros ros-br"></span>
                <span class="orn crest crest-top"></span>
                <span class="orn crest crest-bottom"></span>
                <div class="museum-card" id="museum-card" title="Click to enlarge">
                  <img id="museum-img" src="" alt="">
                </div>
              </div>
            </div>
          </div>
          <div class="museum-placard">
            <div class="museum-card-name" id="museum-name"></div>
            <div class="museum-card-set" id="museum-set"></div>
            <div class="museum-artist" id="museum-artist"></div>
          </div>
        </div>

        <button class="museum-nav" onclick="museumStep(1)" aria-label="Next card">›</button>
      </div>

      <div class="museum-hint">← → browse &nbsp;·&nbsp; esc exit &nbsp;·&nbsp; click card to enlarge</div>
    </div>`;

  // Full-size view in the existing lightbox
  document.getElementById('museum-card').addEventListener('click', () => {
    const card = museumState.cards[museumState.idx];
    const lb  = document.getElementById('card-lightbox');
    const img = document.getElementById('card-lightbox-img');
    img.src = museumHiRes(card.image_url);
    img.alt = card.name || '';
    lb.classList.add('open');
  });

  // Keyboard: arrows browse, Escape exits (unless the lightbox is up).
  // Capture phase so we see Escape before the global handler closes the lightbox.
  museumState.keyHandler = e => {
    if (!document.getElementById('museum-page')) {
      document.removeEventListener('keydown', museumState?.keyHandler, true);
      museumState = null;
      return;
    }
    if (e.key === 'ArrowLeft')  { museumStep(-1); }
    if (e.key === 'ArrowRight') { museumStep(1); }
    if (e.key === 'Escape' && !document.getElementById('card-lightbox').classList.contains('open')) {
      exitMuseum();
    }
  };
  document.addEventListener('keydown', museumState.keyHandler, true);

  // Swipe navigation on touch devices
  let touchX = null;
  const stage = document.querySelector('.museum-stage');
  stage.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 48) museumStep(dx < 0 ? 1 : -1);
    touchX = null;
  }, { passive: true });

  museumShow(0);
}

function museumShow(idx) {
  const ms = museumState;
  if (!ms) return;
  const n = ms.cards.length;
  ms.idx = ((idx % n) + n) % n;
  const card = ms.cards[ms.idx];

  document.getElementById('museum-pos').textContent =
    `${(ms.idx + 1).toLocaleString()} / ${n.toLocaleString()}`;

  const holder  = document.getElementById('museum-card');
  const img     = document.getElementById('museum-img');
  const exhibit = document.querySelector('.museum-exhibit');
  const placard = document.querySelector('.museum-placard');

  // Kick off the dip — exhibit (including spotlight) fades to black
  if (exhibit) exhibit.classList.add('dipping');
  if (placard) { placard.style.transition = 'opacity 0.45s ease'; placard.style.opacity = '0'; }

  const url   = museumHiRes(card.image_url);
  const token = ++ms.loadToken;

  // We gate the reveal on BOTH conditions being true:
  // (a) the 450ms dip has fully completed, AND (b) the image has loaded.
  // This way cached/preloaded images never swap while the frame is still fading.
  let dipDone  = false;
  let imgReady = false;
  let loadedImg = null;
  let loadErr   = false;

  function tryReveal() {
    if (!dipDone || !imgReady) return;   // wait for both gates
    if (token !== ms.loadToken) return;  // navigation moved on, abort
    document.getElementById('museum-wait')?.classList.remove('on');

    // Swap content now — the frame is fully black so no visible pop
    const frameEl = document.getElementById('museum-frame');
    if (frameEl) frameEl.className = 'museum-frame tier-' + museumFrameTier(card.rarity);
    holder.querySelectorAll('.museum-card-missing').forEach(el => el.remove());
    img.classList.remove('loaded');

    if (loadErr) {
      img.removeAttribute('src');
      const msg = document.createElement('div');
      msg.className = 'museum-card-missing';
      msg.textContent = 'Card image unavailable';
      holder.appendChild(msg);
    } else {
      holder.style.setProperty('--nat-w', loadedImg.naturalWidth + 'px');
      img.src = url;
      img.alt = card.name || '';
    }

    document.getElementById('museum-name').textContent   = card.name || 'Untitled';
    document.getElementById('museum-set').textContent    = card.set_name || '';
    document.getElementById('museum-artist').textContent = card.artist ? `Art by ${card.artist}` : '';

    requestAnimationFrame(() => {
      if (!loadErr) img.classList.add('loaded');
      if (exhibit) exhibit.classList.remove('dipping');
      if (placard) placard.style.opacity = '';
    });
  }

  // Gate (a): dip duration — if the image is still loading once dark, show the wait ring
  setTimeout(() => {
    dipDone = true;
    if (!imgReady && token === ms.loadToken) document.getElementById('museum-wait')?.classList.add('on');
    tryReveal();
  }, 450);

  // Gate (b): image load — retry twice with backoff (Drive rate limits are transient)
  let attempts = 0;
  function loadAttempt() {
    const pre = new Image();
    pre.onload = () => {
      if (token !== ms.loadToken) return;
      loadedImg = pre;
      imgReady  = true;
      tryReveal();
    };
    pre.onerror = () => {
      if (token !== ms.loadToken) return;
      if (attempts < 2) {
        attempts++;
        setTimeout(() => { if (token === ms.loadToken) loadAttempt(); }, 1200 * attempts + Math.random() * 600);
        return;
      }
      loadErr  = true;
      imgReady = true;
      tryReveal();
    };
    pre.src = url;
  }
  // Start loading after one frame so the dip CSS transition has begun
  requestAnimationFrame(loadAttempt);

  // Warm the cache for the next card only (keeps Drive request volume low)
  const next = ms.cards[(ms.idx + 1) % n];
  if (next && next !== card) { const p = new Image(); p.src = museumHiRes(next.image_url); }
}

function museumStep(dir) { if (museumState) museumShow(museumState.idx + dir); }

function museumReshuffle() {
  if (!museumState) return;
  shuffleArr(museumState.cards);
  museumShow(0);
}

function exitMuseum() {
  if (museumState?.keyHandler) document.removeEventListener('keydown', museumState.keyHandler, true);
  const game = museumState?.game || state.currentGame;
  museumState = null;
  renderGame(game, state.db);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ── SET VIEW ──────────────────────────────────────────────
function openSet(setId) {
  const db = state.db;
  const set = q(db, 'SELECT * FROM sets WHERE id = ?', [setId])[0];
  if (!set) return;
  state.currentSet = set;
  window.scrollTo({ top: 0, behavior: 'instant' });
  renderSet(set, db);
}

let currentView = 'grid'; // persists across filter changes

// ── Shared card filter utility ───────────────────────────────
function filterCards(cards, raw, types, rarities, artist, attrFilters) {
  let filtered = cards;

  if (raw) {
    // Tokenise — quoted phrases stay together
    const rawTokens = [];
    let cur = '', inQuote = false;
    for (const ch of raw.toLowerCase()) {
      if (ch === '"') { inQuote = !inQuote; }
      else if (ch === ' ' && !inQuote) { if (cur) rawTokens.push(cur); cur = ''; }
      else cur += ch;
    }
    if (cur) rawTokens.push(cur);

    // Merge "field:" empty-value prefix tokens with subsequent non-prefix words
    // So "artist: dan scott" becomes one token "artist:dan scott"
    const tokens = [];
    let i = 0;
    while (i < rawTokens.length) {
      const tok = rawTokens[i];
      const ci = tok.indexOf(':');
      if (ci > 0 && ci === tok.length - 1) {
        // Prefix with no value ("field:") — greedily consume following words
        const field = tok.slice(0, ci);
        let val = '';
        i++;
        while (i < rawTokens.length && rawTokens[i].indexOf(':') < 1) {
          val += (val ? ' ' : '') + rawTokens[i];
          i++;
        }
        tokens.push(val ? field + ':' + val : field + ':');
      } else {
        tokens.push(tok);
        i++;
      }
    }

    const fieldMap = {
      'name':   c => c.name        || '',
      'artist': c => c.artist      || '',
      'type':   c => c.card_type   || '',
      'rarity': c => c.rarity      || '',
      'rules':  c => c.rules_text  || '',
      'rule':   c => c.rules_text  || '',
      'num':    c => c.collector_number || '',
      'attr':   c => { const o = parseExtra(c); return o ? JSON.stringify(o) : ''; },
    };
    const getExtra = c => {
      if (c._extraStr !== undefined) return c._extraStr;
      const o = parseExtra(c);
      c._extraStr = o ? Object.entries(o).map(([k,v]) => `${k} ${v}`).join(' ').toLowerCase() : '';
      return c._extraStr;
    };

    filtered = filtered.filter(c => {
      const extra = getExtra(c);
      return tokens.every(tok => {
        const ci = tok.indexOf(':');
        if (ci > 0) {
          const field = tok.slice(0, ci), val = tok.slice(ci + 1);
          // Numeric comparison operators: >, <, >=, <=, =
          const opMatch = val.match(/^(>=|<=|>|<|=)(.+)$/);
          const compare = (fieldVal) => {
            if (opMatch) {
              const n = parseFloat(fieldVal), target = parseFloat(opMatch[2]);
              if (isNaN(n) || isNaN(target)) return false;
              switch (opMatch[1]) {
                case '>':  return n >  target;
                case '<':  return n <  target;
                case '>=': return n >= target;
                case '<=': return n <= target;
                case '=':  return n === target;
              }
            }
            return String(fieldVal).toLowerCase().includes(val);
          };
          const fn = fieldMap[field];
          if (fn) return compare(fn(c));
          const obj = parseExtra(c); if (obj && field in obj) return compare(obj[field]); return false;
        }
        return (c.name || '').toLowerCase().includes(tok) ||
               (c.artist || '').toLowerCase().includes(tok) ||
               (c.rules_text || '').toLowerCase().includes(tok) ||
               (c.flavor_text || '').toLowerCase().includes(tok) ||
               extra.includes(tok);
      });
    });
  }

  const typeSet   = types   instanceof Set ? types   : (types   ? new Set([types])   : new Set());
  const raritySet = rarities instanceof Set ? rarities : (rarities ? new Set([rarities]) : new Set());
  if (typeSet.size)   filtered = filtered.filter(c => typeSet.has(c.card_type));
  if (raritySet.size) filtered = filtered.filter(c => raritySet.has(c.rarity));
  if (artist) filtered = filtered.filter(c => c.artist === artist);
  if (attrFilters && Object.keys(attrFilters).length) {
    const entries = Object.entries(attrFilters);
    filtered = filtered.filter(c => {
      const obj = parseExtra(c);
      return obj && entries.every(([k,v]) => String(obj[k]) === v);
    });
  }
  return filtered;
}

// ── Cached extra_data parse (perf: avoids repeated JSON.parse) ──
function parseExtra(c) {
  if (c._extra !== undefined) return c._extra;
  if (!c.extra_data) { c._extra = null; return null; }
  try { c._extra = JSON.parse(c.extra_data); } catch(e) { c._extra = null; }
  return c._extra;
}

// ── Card sorting ──────────────────────────────────────────
const RARITY_ORDER = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary', 'Mythic'];
function sortCards(cards, sortKey) {
  if (!sortKey || sortKey === 'default') return cards;
  const sorted = [...cards];
  if (sortKey === 'name') {
    sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  } else if (sortKey === 'rarity') {
    sorted.sort((a, b) => {
      const ia = RARITY_ORDER.indexOf(a.rarity), ib = RARITY_ORDER.indexOf(b.rarity);
      const va = ia === -1 ? RARITY_ORDER.length : ia;
      const vb = ib === -1 ? RARITY_ORDER.length : ib;
      return va - vb || (a.name || '').localeCompare(b.name || '');
    });
  } else if (sortKey.startsWith('attr:')) {
    const key = sortKey.slice(5);
    const getV = c => { const o = parseExtra(c); if (!o) return Infinity; const n = parseFloat(o[key]); return isNaN(n) ? Infinity : n; };
    sorted.sort((a, b) => getV(a) - getV(b) || (a.name || '').localeCompare(b.name || ''));
  }
  return sorted;
}

// Detect numeric extra_data keys for sort options
function getNumericAttrKeys(cards) {
  const keys = {};
  for (const c of cards) {
    const obj = parseExtra(c);
    if (!obj) continue;
    for (const [k, v] of Object.entries(obj)) {
      if (v === null || v === '') continue;
      if (!(k in keys)) keys[k] = true;
      if (isNaN(parseFloat(v))) keys[k] = false;
    }
  }
  return Object.entries(keys).filter(([k, isNum]) => isNum).map(([k]) => k);
}

// ── URL hash routing (shareable links) ────────────────────
// Scheme:   #/gameId               → game page
//           #/gameId/db?sets=…     → card database (filters in the query part)
//           #/gameId/museum        → museum
//           #/gameId/set/N         → single set page
// Legacy:   #game=id&sets=…        → still recognized, mapped to the db route
let _hashTimer = null;

// Immediately set the route ('' clears the hash). Cancels pending throttled writes.
function setRoute(path) {
  clearTimeout(_hashTimer);
  history.replaceState(null, '', path ? '#/' + path : location.pathname + location.search);
}

// Throttled: browsers rate-limit history.replaceState (Safari: 100 per 30s)
function writeDbHash(gameId, setIds, q, types, rarities, sortKey, view) {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const parts = [];
    if (setIds && setIds.size) parts.push(`sets=${[...setIds].join(',')}`);
    if (q) parts.push(`q=${encodeURIComponent(q)}`);
    if (types && types.size) parts.push(`types=${[...types].map(encodeURIComponent).join('|')}`);
    if (rarities && rarities.size) parts.push(`rarities=${[...rarities].map(encodeURIComponent).join('|')}`);
    if (sortKey && sortKey !== 'default') parts.push(`sort=${encodeURIComponent(sortKey)}`);
    if (view && view !== 'grid') parts.push(`view=${view}`);
    const qs = parts.length ? '?' + parts.join('&') : '';
    history.replaceState(null, '', `#/${encodeURIComponent(gameId)}/db${qs}`);
  }, 400);
}

// Parse db filter params (the part after '?') into the restore shape
function parseDbQuery(queryPart) {
  const params = {};
  (queryPart || '').split('&').forEach(p => {
    const [k, v] = p.split('=');
    if (k && v !== undefined) params[k] = decodeURIComponent(v);
  });
  return {
    sets: params.sets ? params.sets.split(',').map(Number).filter(n => !isNaN(n)) : [],
    q: params.q || '',
    types: params.types ? params.types.split('|') : [],
    rarities: params.rarities ? params.rarities.split('|') : [],
    sort: params.sort || 'default',
    view: params.view || 'grid',
  };
}

// Parse the current hash into a route: { game, kind, filters?, setId? } or null
function parseRoute() {
  const h = location.hash.slice(1);
  if (!h) return null;

  // Legacy format: game=id&sets=…  → db route
  if (h.startsWith('game=')) {
    const filters = parseDbQuery(h);
    const gameParam = h.split('&').map(p => p.split('=')).find(([k]) => k === 'game');
    if (!gameParam || !gameParam[1]) return null;
    return { game: decodeURIComponent(gameParam[1]), kind: 'db', filters };
  }

  if (!h.startsWith('/')) return null;
  const [pathPart, queryPart] = h.slice(1).split('?');
  const segs = pathPart.split('/').filter(Boolean).map(decodeURIComponent);
  if (!segs.length) return null;

  const route = { game: segs[0], kind: 'game' };
  if (segs[1] === 'db') { route.kind = 'db'; route.filters = parseDbQuery(queryPart); }
  else if (segs[1] === 'museum') { route.kind = 'museum'; }
  else if (segs[1] === 'set' && segs[2]) { route.kind = 'set'; route.setId = parseInt(segs[2]); }
  return route;
}

// ── Pill filter toggle helper ─────────────────────────────
function handleFilterPillClick(containerId, dataAttr, clickedBtn) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const isAll = clickedBtn.dataset[dataAttr] === '';
  if (isAll) {
    container.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    clickedBtn.classList.add('active');
  } else {
    container.querySelector(`.filter-pill[data-${dataAttr}=""]`)?.classList.remove('active');
    clickedBtn.classList.toggle('active');
    if (![...container.querySelectorAll('.filter-pill')].some(b => b.classList.contains('active'))) {
      container.querySelector(`.filter-pill[data-${dataAttr}=""]`)?.classList.add('active');
    }
  }
}

function getActivePills(containerId, dataAttr) {
  return new Set([...document.querySelectorAll(`#${containerId} .filter-pill.active`)].map(b => b.dataset[dataAttr]).filter(Boolean));
}

// ── Helper: build attr filter HTML from a card array ──────────
function buildAttrFilterHtml(cards) {
  const attrKeys = {};
  cards.forEach(c => {
    const obj = parseExtra(c);
    if (!obj) return;
    Object.entries(obj).forEach(([k, v]) => {
      if (!attrKeys[k]) attrKeys[k] = new Set();
      if (v !== null && v !== '') attrKeys[k].add(String(v));
    });
  });
  if (!Object.keys(attrKeys).length) return '';
  return `<div class="attr-filter-row" id="attr-filters">
    <span class="attr-filter-label">Attributes</span>
    ${Object.entries(attrKeys).map(([k, vals]) =>
      `<select class="filter-select attr-filter" data-attr="${k}" title="${k}">
        <option value="">All ${k}</option>
        ${[...vals].sort((a, b) => {
            const na = parseFloat(a), nb = parseFloat(b);
            return (!isNaN(na) && !isNaN(nb)) ? na - nb : String(a).localeCompare(String(b));
          }).map(v => `<option value="${v}">${v}</option>`).join('')}
      </select>`
    ).join('')}
  </div>`;
}

// ── Helper: build standard filter controls HTML ────────────────
function buildFilterControls(types, rarities, artists, attrHtml, numericAttrKeys) {
  const RARITY_COLORS = {
    Common:'#6e6e6e', Uncommon:'#5a8fa8', Rare:'#c8963c',
    Epic:'#7b3fa0', Legendary:'#b05a20', Mythic:'#b05a20',
    Promo:'#9b30ff', Fixed:'#ffffff'
  };
  const opts = (list, ph) =>
    `<option value="">${ph}</option>` + list.map(v => `<option value="${v}">${v}</option>`).join('');

  const typePills = types.map(t =>
    `<button class="filter-pill type-pill" data-type="${t}">${t}</button>`
  ).join('');

  // Pill order: common → uncommon → rare → epic → legendary, then others alphabetically
  const PILL_ORDER = ['common', 'uncommon', 'rare', 'epic', 'legendary'];
  rarities = [...rarities].sort((a, b) => {
    const ia = PILL_ORDER.indexOf(String(a).toLowerCase());
    const ib = PILL_ORDER.indexOf(String(b).toLowerCase());
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return String(a).localeCompare(String(b));
  });

  const rarityPills = rarities.map(r => {
    const col = RARITY_COLORS[r] || '#111';
    return `<button class="filter-pill rarity-pill" data-rarity="${r}"><span class="rarity-pip" style="background:${col}"></span>${r}</button>`;
  }).join('');

  const artistSelect = artists.length
    ? `<div class="db-adv-row"><span class="db-filter-section-label">Artist</span>
        <select class="filter-select" id="artist-filter">${opts(artists, 'All artists')}</select></div>`
    : '';

  return `<div class="db-controls">
    <div class="db-search-row">
      <input class="search-input db-search-main" id="card-search"
        placeholder='Search — plain words, "quoted phrases", field: value (artist: name, rules: text), or numbers (cost:>2, power:=5)' autocomplete="off">
      <button class="btn-random" id="btn-random">⚄ Random</button>
    </div>
    ${types.length ? `<div class="db-filter-section">
      <span class="db-filter-section-label">Type</span>
      <div class="filter-pills" id="type-pills">
        <button class="filter-pill type-pill active" data-type="">All</button>${typePills}
      </div>
    </div>` : ''}
    ${rarities.length ? `<div class="db-filter-section">
      <span class="db-filter-section-label">Rarity</span>
      <div class="filter-pills" id="rarity-pills">
        <button class="filter-pill rarity-pill active" data-rarity="">All</button>${rarityPills}
      </div>
    </div>` : ''}
    <button class="db-advanced-toggle" id="db-advanced-toggle">
      <span class="db-adv-icon">▶</span>Advanced Filters
    </button>
    <div class="db-advanced-panel" id="db-advanced-panel">
      ${attrHtml || ''}
      ${artistSelect}
    </div>
    <div class="db-bottom-row">
      <span class="db-count" id="db-count"></span>
      <div class="db-right-controls">
        <button class="db-stats-toggle" id="db-stats-toggle">Stats</button>
        <select class="filter-select sort-select" id="sort-select">
          <option value="default">Sort: Collector #</option>
          <option value="name">Sort: Name A–Z</option>
          <option value="rarity">Sort: Rarity</option>
          ${(numericAttrKeys || []).map(k => `<option value="attr:${k}">Sort: ${k}</option>`).join('')}
        </select>
        <div class="size-control">
          <span class="size-control-label">Size</span>
          <input type="range" class="size-slider" id="grid-size" min="80" max="220" step="5" value="${gridColWidth}">
        </div>
        <div class="view-toggle">
          <button class="view-toggle-btn ${currentView==='grid'?'active':''}" id="btn-grid" title="Grid view">⊞</button>
          <button class="view-toggle-btn ${currentView==='list'?'active':''}" id="btn-list" title="List view">☰</button>
        </div>
      </div>
    </div>
  </div>
  <div class="db-stats-panel" id="db-stats-panel"></div>`;
}

// ── Helper: bind standard filter events ───────────────────────
function bindFilterEvents(applyFn, applySizeFn, setViewFn, getLastFiltered) {
  // Debounced search — avoids full re-filter on every keystroke
  let searchTimer = null;
  document.getElementById('card-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFn, 160);
  });
  document.getElementById('artist-filter')?.addEventListener('change', applyFn);
  document.querySelectorAll('.attr-filter').forEach(s => s.addEventListener('change', applyFn));

  document.getElementById('type-pills')?.addEventListener('click', e => {
    const btn = e.target.closest('.type-pill');
    if (btn) { handleFilterPillClick('type-pills', 'type', btn); applyFn(); }
  });
  document.getElementById('rarity-pills')?.addEventListener('click', e => {
    const btn = e.target.closest('.rarity-pill');
    if (btn) { handleFilterPillClick('rarity-pills', 'rarity', btn); applyFn(); }
  });

  document.getElementById('btn-random')?.addEventListener('click', () => {
    const pool = getLastFiltered();
    if (!pool.length) return;
    showCard(pool[Math.floor(Math.random() * pool.length)].id);
  });

  const advToggle = document.getElementById('db-advanced-toggle');
  const advPanel  = document.getElementById('db-advanced-panel');
  advToggle?.addEventListener('click', () => {
    advPanel?.classList.toggle('open');
    advToggle.classList.toggle('open');
  });

  document.getElementById('sort-select')?.addEventListener('change', applyFn);
  document.getElementById('db-stats-toggle')?.addEventListener('click', () => {
    document.getElementById('db-stats-panel')?.classList.toggle('open');
    document.getElementById('db-stats-toggle')?.classList.toggle('open');
    applyFn(); // refresh stats content
  });
  document.getElementById('grid-size')?.addEventListener('input', applySizeFn);
  document.getElementById('btn-grid')?.addEventListener('click', () => setViewFn('grid'));
  document.getElementById('btn-list')?.addEventListener('click', () => setViewFn('list'));
  const sc = document.getElementById('grid-size')?.closest('.size-control');
  if (currentView === 'list' && sc) sc.style.display = 'none';
}

// ── Stats panel renderer ──────────────────────────────────
function renderStatsPanel(cards) {
  const panel = document.getElementById('db-stats-panel');
  if (!panel || !panel.classList.contains('open')) return;
  const count = (field) => {
    const m = {};
    cards.forEach(c => { const v = c[field] || '—'; m[v] = (m[v] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };
  const max = arr => Math.max(1, ...arr.map(e => e[1]));
  const col = (title, entries) => {
    const m = max(entries);
    return `<div><div class="db-stats-col-title">${title}</div>
      ${entries.slice(0, 12).map(([name, n]) => `
        <div class="db-stat-row">
          <span class="db-stat-name" title="${name}">${name}</span>
          <span class="db-stat-bar-wrap"><span class="db-stat-bar" style="width:${(n/m*100).toFixed(1)}%;display:block"></span></span>
          <span class="db-stat-count">${n.toLocaleString()}</span>
        </div>`).join('')}
    </div>`;
  };
  panel.innerHTML = col('By Rarity', count('rarity')) + col('By Type', count('card_type'));
}

function renderSet(set, db) {

      </div>

      allCards,

  bindFilterEvents(applyFilters, applySize, setView, () => lastFiltered);

// ── GAME DATABASE VIEW (all sets combined) ────────────────────
function renderGameDb(game, db, preSetId = null, restore = null) {
  if (!db) return;
  window.scrollTo({ top: 0, behavior: 'instant' });
  const sets = q(db, 'SELECT * FROM sets ORDER BY id ASC');
  // Fetch fields needed for grid display AND search (artist/rules/flavor needed for search)
  const allCards = q(db, `
    SELECT c.id, c.set_id, c.collector_number, c.name, c.card_type, c.rarity,
           c.image_url, c.extra_data, c.artist, c.rules_text, c.flavor_text,
           s.name AS set_name
    FROM cards c JOIN sets s ON c.set_id = s.id
    ORDER BY s.id ASC, CAST(c.collector_number AS INTEGER), c.name`);

  state.currentSet = null;
  setBreadcrumb([
    { label: 'Archive', onClick: 'renderHome' },
    { label: game.name, onClick: 'renderGame(state.currentGame, state.db)' },
    { label: 'Card Database' }
  ]);
  setRoute(`${encodeURIComponent(game.id)}/db`);
  tcgTrack(`Database — ${game.name}`);

  const preSetIdParsed = preSetId ? parseInt(preSetId) : null;
  let activeSetIds = restore?.sets?.length
    ? new Set(restore.sets)
    : (preSetIdParsed ? new Set([preSetIdParsed]) : new Set());
  if (restore?.view) currentView = restore.view;
  let getPool = () => activeSetIds.size
    ? allCards.filter(c => activeSetIds.has(c.set_id))
    : allCards;

  const unique = (f, cards) => [...new Set(cards.map(c => c[f]).filter(Boolean))].sort();

  // Set filter bar — multi-select buttons, one per set plus "All Sets"
  const setBarHtml = `<div class="game-db-set-bar" id="game-db-set-bar">
    <button class="set-filter-btn set-filter-all${!activeSetIds.size ? ' active' : ''}" data-set-id="">
      <span class="set-filter-check"></span>
      <span class="set-filter-name">All Sets — ${allCards.length} cards</span>
    </button>
    ${sets.map(s => `<button class="set-filter-btn${activeSetIds.has(s.id) ? ' active' : ''}" data-set-id="${s.id}" title="${s.name}">
      <span class="set-filter-check"></span>
      <span class="set-filter-name">${s.name}</span>
    </button>`).join('')}
  </div>`;

  const pool = getPool();
  const attrHtml = buildAttrFilterHtml(allCards);
  const numericKeys = getNumericAttrKeys(allCards);
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="db-back-bar">
        <button class="db-back-btn" onclick="renderGame(state.currentGame, state.db)">← ${game.name}</button>
      </div>
      ${setBarHtml}
      ${buildFilterControls(unique('card_type', allCards), unique('rarity', allCards), unique('artist', allCards), attrHtml, numericKeys)}
      <div id="card-grid-wrap"></div>
    </div>`;

  // Restore state from shared URL (search text, pills, sort)
  if (restore) {
    if (restore.q) document.getElementById('card-search').value = restore.q;
    if (restore.sort && restore.sort !== 'default') {
      const ss = document.getElementById('sort-select');
      if (ss && [...ss.options].some(o => o.value === restore.sort)) ss.value = restore.sort;
    }
    const activatePills = (containerId, dataAttr, values) => {
      if (!values.length) return;
      const container = document.getElementById(containerId);
      if (!container) return;
      container.querySelector(`.filter-pill[data-${dataAttr}=""]`)?.classList.remove('active');
      values.forEach(v => {
        container.querySelector(`.filter-pill[data-${dataAttr}="${CSS.escape(v)}"]`)?.classList.add('active');
      });
      if (![...container.querySelectorAll('.filter-pill')].some(b => b.classList.contains('active'))) {
        container.querySelector(`.filter-pill[data-${dataAttr}=""]`)?.classList.add('active');
      }
    };
    activatePills('type-pills', 'type', restore.types || []);
    activatePills('rarity-pills', 'rarity', restore.rarities || []);
  }

  let lastFiltered = pool;

  function applyFilters() {
    const p = getPool();
    const attrFilters = {};
    document.querySelectorAll('.attr-filter').forEach(s => { if (s.value) attrFilters[s.dataset.attr] = s.value; });
    const searchQ = document.getElementById('card-search')?.value?.trim() || '';
    const typesActive = getActivePills('type-pills', 'type');
    const raritiesActive = getActivePills('rarity-pills', 'rarity');
    const sortKey = document.getElementById('sort-select')?.value || 'default';
    lastFiltered = sortCards(filterCards(
      p, searchQ, typesActive, raritiesActive,
      document.getElementById('artist-filter')?.value || '',
      attrFilters
    ), sortKey);
    const ce = document.getElementById('db-count');
    if (ce) ce.textContent = `${lastFiltered.length.toLocaleString()} of ${allCards.length.toLocaleString()} cards`;
    renderStatsPanel(lastFiltered);
    writeDbHash(game.id, activeSetIds, searchQ, typesActive, raritiesActive, sortKey, currentView);
    currentView === 'list' ? renderCardList(lastFiltered) : renderCardGrid(lastFiltered);
  }

  function applySize() {
    gridColWidth = +document.getElementById('grid-size').value;
    const g = document.querySelector('.card-grid');
    if (g) g.style.gridTemplateColumns = `repeat(auto-fill, minmax(${gridColWidth}px, 1fr))`;
  }

  function setView(v) {
    currentView = v;
    document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
    document.getElementById('btn-list').classList.toggle('active', v === 'list');
    const sc = document.getElementById('grid-size')?.closest('.size-control');
    if (sc) sc.style.display = v === 'list' ? 'none' : '';
    applyFilters();
  }

  // Set filter bar — multi-select click handler
  document.getElementById('game-db-set-bar').addEventListener('click', e => {
    const btn = e.target.closest('.set-filter-btn');
    if (!btn) return;
    const rawId = btn.dataset.setId;
    if (!rawId) {
      // "All Sets" — clear selection
      activeSetIds.clear();
    } else {
      const sid = parseInt(rawId);
      if (activeSetIds.has(sid)) {
        activeSetIds.delete(sid);
      } else {
        activeSetIds.add(sid);
      }
    }
    // Update visuals
    document.querySelectorAll('.set-filter-btn').forEach(b => {
      const sid = b.dataset.setId ? parseInt(b.dataset.setId) : null;
      b.classList.toggle('active', sid ? activeSetIds.has(sid) : activeSetIds.size === 0);
    });
    applyFilters();
  });

  bindFilterEvents(applyFilters, applySize, setView, () => lastFiltered);
  applyFilters();
}

// IntersectionObserver for truly lazy image loading
let lazyObserver = null;
function setupLazyObserver() {
  if (lazyObserver) lazyObserver.disconnect();
  lazyObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        if (img.dataset.src) {
          img.src = img.dataset.src;
          delete img.dataset.src;
          lazyObserver.unobserve(img);
        }
      }
    });
  }, { rootMargin: '200px' });
}

function renderCardGrid(cards) {
  setModalNavList(cards);
  const wrap = document.getElementById('card-grid-wrap');
  if (!wrap) return;
  if (!cards.length) {
    wrap.innerHTML = `<div class="state-msg"><h3>No cards match</h3></div>`;
    return;
  }
  setupLazyObserver();
  wrap.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'card-grid';
  grid.style.gridTemplateColumns =
    `repeat(auto-fill, minmax(${gridColWidth}px, 1fr))`;
  wrap.appendChild(grid);

  // Render in chunks to keep UI responsive for large sets
  const CHUNK = 80;
  let offset = 0;
  function renderChunk() {
    const frag = document.createDocumentFragment();
    const tmp = document.createElement('div');
    tmp.innerHTML = cards.slice(offset, offset + CHUNK).map(buildCardTile).join('');
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    grid.appendChild(frag);
    // Observe newly added lazy images
    grid.querySelectorAll('img[data-src]:not([data-observed])').forEach(img => {
      img.dataset.observed = '1';
      lazyObserver.observe(img);
    });
    offset += CHUNK;
    if (offset < cards.length) {
      const idle = window.requestIdleCallback || (fn => setTimeout(fn, 16));
      idle(renderChunk);
    }
  }
  renderChunk();
}

      <div class="card-list-cell cell-rarity">
        ${rClass ? `<span class="cell-dot ${rClass}"></span>` : ''}
        ${c.rarity || '—'}
      </div>
      <div class="card-list-cell">${c.artist || '—'}</div>
    </div>`;
  }).join('');
  wrap.innerHTML = `<div class="card-list">${header}${rows}</div>`;
}

// Preview frames: one retry, then become an empty non-clickable frame
function previewImgRetry(el) {
  if (el.dataset.retried) {
    el.parentElement?.removeAttribute('data-preview-url');
    el.remove();
    return;
  }
  el.dataset.retried = '1';
  const url = el.src;
  setTimeout(() => {
    if (!el.isConnected) return;
    el.removeAttribute('src');
    el.src = url;
  }, 1500 + Math.random() * 800);
}

// On image failure: show the info placeholder INSTANTLY (no broken-image icon,
// no delay), then retry quietly in the background — Drive rate limits are
// usually transient. If a retry succeeds the scan swaps back in.
function cardImgRetry(el, num, name, type) {
  const tile = el.parentElement;
  if (!tile) return;

  // Instant fallback: hide img + hover overlay, show placeholder text
  el.style.display = 'none';
  const overlay = tile.querySelector('.card-tile-overlay');
  if (overlay) overlay.style.display = 'none';
  if (!tile.querySelector('.card-placeholder')) {
    tile.insertAdjacentHTML('beforeend', `
      <div class="card-placeholder">
        <div class="ph-num">${num ? '#' + num : ''}</div>
        <div class="ph-name">${name}</div>
        <div class="ph-type">${type || ''}</div>
      </div>
      <div class="no-scan-badge">NO SCAN</div>`);
  }

  // Background retries (max 2, backoff + jitter)
  const tries = +(el.dataset.retries || 0);
  if (tries >= 2) return;
  el.dataset.retries = tries + 1;
  const url = el.src;
  setTimeout(() => {
    if (!el.isConnected) return;
    el.onload = () => {
      tile.querySelector('.card-placeholder')?.remove();
      tile.querySelector('.no-scan-badge')?.remove();
      el.style.display = '';
      if (overlay) overlay.style.display = '';
    };
    el.removeAttribute('src');
    el.src = url;
  }, 1200 * (tries + 1) + Math.random() * 800);
}

function modalImgFallback(el) {
  el.outerHTML = '<div class="modal-no-img">No scan available</div>';
}

function buildCardTile(c) {
  const rClass = c.rarity ? `r-${c.rarity}` : '';
  const safeNum  = (c.collector_number || '').replace(/'/g, '');
  const safeName = (c.name            || '').replace(/'/g, '&#39;');
  const safeType = (c.card_type       || '').replace(/'/g, '');
  const inner = c.image_url
    ? `<img data-src="${c.image_url}" alt="${c.name}"
           onerror="cardImgRetry(this,'${safeNum}','${safeName}','${safeType}')">
       <div class="card-tile-overlay">
         <div class="ov-name">${c.name}</div>
         <div class="ov-type">${c.card_type || ''}</div>
       </div>`
    : `<div class="card-placeholder">
         <div class="ph-num">${c.collector_number ? '#' + c.collector_number : ''}</div>
         <div class="ph-name">${c.name}</div>
         <div class="ph-type">${c.card_type || ''}</div>
       </div>
       <div class="no-scan-badge">NO SCAN</div>
       ${rClass ? `<div class="rarity-dot ${rClass}" style="top:6px;left:6px;right:auto"></div>` : ''}`;

  // Rarity dot only shown on cards without a scan
  return `<div class="card-tile" onclick="showCard(${c.id})">${inner}</div>`;
}

// ── CARD MODAL ────────────────────────────────────────────
// Navigation list for prev/next stepping — set by renderCardGrid/List
let modalNavList = [];
function setModalNavList(cards) { modalNavList = cards; }

function showCard(cardId) {
  const db = state.db;
  const c = q(db, 'SELECT * FROM cards WHERE id = ?', [cardId])[0];
  if (!c) return;
  const navIdx = modalNavList.findIndex(x => x.id === cardId);

  const fullSizeUrl = c.image_url
    ? c.image_url.replace(/sz=w\d+/, 'sz=w3000')
    : null;
  const downloadBtn = fullSizeUrl
    ? `<a class="modal-download" href="${fullSizeUrl}" download="${c.name || 'card'}.jpg" target="_blank">↓ Download full-size image</a>`
    : '';
  document.getElementById('modal-img').innerHTML = c.image_url
    ? `<img class="modal-card-img" src="${c.image_url}" alt="${c.name}" onerror="modalImgFallback(this)">${downloadBtn}`
    : `<div class="modal-no-img">No scan available</div>`;

  // Extra data chips
  let extraHtml = '';
  if (c.extra_data) {
    try {
      const obj = JSON.parse(c.extra_data);
      const chips = Object.entries(obj)
        .map(([k,v]) => `<span class="extra-chip"><strong>${k}</strong>${v}</span>`).join('');
      if (chips) extraHtml = `<div class="modal-field"><label>Attributes</label><div class="extra-chips">${chips}</div></div>`;
    } catch(e) {}
  }

  const rClass = c.rarity ? `r-${c.rarity}` : '';

  document.getElementById('modal-info').innerHTML = `
    <div class="modal-num">${[
      c.collector_number ? `# ${c.collector_number}` : '',
      state.currentSet?.name || ''
    ].filter(Boolean).join(' · ')}</div>
    <div class="modal-name">
      ${rClass ? `<span class="rarity-dot ${rClass}" style="position:relative;top:auto;right:auto;width:10px;height:10px;flex-shrink:0"></span>` : ''}${c.name}
    </div>
    <div class="modal-typeline">
      ${[c.card_type, c.rarity].filter(Boolean).join(' · ')}
    </div>
    ${c.rules_text ? `<div class="modal-field"><label>Rules Text</label><p>${c.rules_text}</p></div>` : ''}
    ${c.flavor_text ? `<div class="modal-field"><label>Flavor Text</label><p class="flavor">${c.flavor_text}</p></div>` : ''}
    ${extraHtml}
    ${c.artist ? `<div class="modal-field"><label>Artist</label><p>${c.artist}</p></div>` : ''}
    ${c.source_notes ? `<div class="modal-field"><label>Source Notes</label><p>${c.source_notes}</p></div>` : ''}
  `;

  // Prev/next navigation buttons
  const modal = document.getElementById('modal');
  modal.querySelectorAll('.modal-nav').forEach(b => b.remove());
  if (navIdx !== -1 && modalNavList.length > 1) {
    const prevBtn = document.createElement('button');
    prevBtn.className = 'modal-nav modal-nav-prev';
    prevBtn.innerHTML = '‹';
    prevBtn.disabled = navIdx <= 0;
    prevBtn.addEventListener('click', e => { e.stopPropagation(); if (navIdx > 0) showCard(modalNavList[navIdx - 1].id); });
    const nextBtn = document.createElement('button');
    nextBtn.className = 'modal-nav modal-nav-next';
    nextBtn.innerHTML = '›';
    nextBtn.disabled = navIdx >= modalNavList.length - 1;
    nextBtn.addEventListener('click', e => { e.stopPropagation(); if (navIdx < modalNavList.length - 1) showCard(modalNavList[navIdx + 1].id); });
    modal.appendChild(prevBtn);
    modal.appendChild(nextBtn);
  }

  document.getElementById('modal-bg').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-bg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeAbout(); closeLightbox(); return; }
  // Arrow navigation when card modal is open
  if (document.getElementById('modal-bg').classList.contains('open')) {
    if (e.key === 'ArrowLeft')  document.querySelector('.modal-nav-prev:not(:disabled)')?.click();
    if (e.key === 'ArrowRight') document.querySelector('.modal-nav-next:not(:disabled)')?.click();
  }
});
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
function closeLightbox() { document.getElementById('card-lightbox').classList.remove('open'); }
document.getElementById('card-lightbox').addEventListener('click', closeLightbox);

// ── About modal ───────────────────────────────────────────
document.getElementById('footer-about-btn').addEventListener('click', () => {
  document.getElementById('about-modal-bg').classList.add('open');
});
document.getElementById('about-modal-close').addEventListener('click', closeAbout);
document.getElementById('about-modal-bg').addEventListener('click', e => { if (e.target === e.currentTarget) closeAbout(); });
function closeAbout() { document.getElementById('about-modal-bg').classList.remove('open'); }

// ── Logo → home ───────────────────────────────────────────
document.getElementById('logo').addEventListener('click', renderHome);

// ── Image fallback helpers ────────────────────────────────
function tileImgFallback(el, name) {
  el.parentElement.innerHTML = `<div class="game-tile-hero-fallback"><span>${name}</span></div>`;
}
function pageHeroFallback(el) {
  el.parentElement.innerHTML = `<div class="game-page-hero-fallback"></div>`;
}

// ── Go ────────────────────────────────────────────────────
boot();
</script>
